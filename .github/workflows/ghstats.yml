name: ghstats

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tiennm99/ghstats@v1
        with:
          user: ${{ github.repository_owner }}
          token: ${{ secrets.GHSTATS_TOKEN || github.token }}
          out: ghstats
          themes: dracula
          tz: Asia/Saigon
          start_of_week: monday
          top_repos: "0"
          commits_per_repo: "500"
          include_forks: "true"
          include_private: "true"
          include_org_repos: "false"
          commit_changes: "true"
          commit_message: "chore: refresh ghstats cards"
          commit_branch: ""
          author_name: "github-actions[bot]"
          author_email: "41898282+github-actions[bot]@users.noreply.github.com"
